<html lang="en">
<head>

<title>Marketing Planner</title>
<meta name="description" content="Build a marketing plan and a sign-up landing page for your event, resource, or ministry.">
<meta property="og:type" content="website">
<meta property="og:title" content="Marketing Planner">
<meta property="og:description" content="Build a marketing plan and a sign-up landing page for your event, resource, or ministry.">

<style>
:root{--bg:#f2f6f7;--surface:#fff;--ink:#14282d;--muted:#58707a;--line:#d5e0e3;--pri:#1b5e63;--pri-ink:#fff;--gold:#f0b43c;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c20;--surface:#172a2f;--ink:#e8f1f2;--muted:#9bb2b8;--line:#2a4249;--pri:#5fc0c6;--pri-ink:#062124;--gold:#f0b43c;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1c20;--surface:#172a2f;--ink:#e8f1f2;--muted:#9bb2b8;--line:#2a4249;--pri:#5fc0c6;--pri-ink:#062124;--gold:#f0b43c;--err:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;line-height:1.15;margin:0 0 .5rem}
header{padding:1.4rem 1.2rem .6rem;max-width:760px;margin:0 auto}
.logo{display:block;height:40px;width:auto;max-width:100%;margin-bottom:1rem}.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
header h1{font-size:1.9rem}header p{margin:.2rem 0 0;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:0 1.2rem 3rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:1rem 0 .4rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.step{color:var(--muted);font-size:.95rem;margin-bottom:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
label{display:block;font-weight:600;margin:1rem 0 .3rem}label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem}
textarea{min-height:100px;resize:vertical}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:grid;gap:.8rem;grid-template-columns:1fr 1fr}@media(max-width:560px){.row{grid-template-columns:1fr}}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.3rem}
button{font:inherit;font-weight:600;border-radius:10px;padding:.7rem 1.1rem;border:1px solid var(--pri);background:transparent;color:var(--pri);cursor:pointer;min-height:44px}
button.p{background:var(--pri);color:var(--pri-ink)}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.types button{text-align:left;padding:.9rem;border-color:var(--line);color:var(--ink);background:var(--surface)}
.types button small{display:block;font-weight:400;color:var(--muted)}
.types button[aria-pressed=true]{border:2px solid var(--pri);background:var(--bg)}
.q{border-left:4px solid var(--gold);padding-left:.9rem;margin:1.1rem 0}
.q p{margin:0;font-weight:600}.q span{color:var(--muted);font-size:.93rem}
.err{color:var(--err);font-weight:600;margin-top:.8rem}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}.tabs button[aria-selected=true]{background:var(--pri);color:var(--pri-ink)}
.phase{border-left:4px solid var(--pri);padding:.2rem 0 .2rem 1rem;margin:0 0 1.4rem}
.phase .when{color:var(--muted);font-size:.95rem;margin-bottom:.4rem}
.phase ul{margin:.3rem 0 .6rem;padding-left:1.2rem}.phase li{margin:.25rem 0}
.sample{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:.7rem .8rem;font-size:.95rem;white-space:pre-wrap}
iframe{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;background:#fff}
.note{color:var(--muted);font-size:.93rem}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.95rem}
@media print{header,.btns,.tabs,.bar,.step,#land,.noprint{display:none!important}body{background:#fff}}
</style>
</head>

function show(html){app.innerHTML=html;window.scrollTo(0,0)}

function step0(){
 var b='';Object.keys(TYPES).forEach(function(k){b+='<button type="button" data-t="'+k+'" aria-pressed="'+(S.type===k)+'">'+TYPES[k].label+'<small>'+TYPES[k].hint+'</small></button>'});
 show(progress()+'<div class="card"><h2>What are you promoting?</h2><div class="types">'+b+'</div>'+
 '<label for="name">Name or title</label><input id="name" value="'+esc(S.f.name)+'" placeholder="e.g. Marriage Enrichment Weekend">'+
 '<div id="e" class="err"></div><div class="btns"><button class="p" id="next">Continue</button></div></div>');
 app.querySelectorAll('[data-t]').forEach(function(x){x.onclick=function(){S.type=x.dataset.t;app.querySelectorAll('[data-t]').forEach(function(y){y.setAttribute('aria-pressed',y===x)})}});
 document.getElementById('next').onclick=function(){var n=document.getElementById('name').value.trim();
  if(!S.type)return err('Choose what you are promoting.');if(!n)return err('Enter a name or title.');S.f.name=n;S.step=1;save();render()}}
function err(m){document.getElementById('e').textContent=m}

function step1(){
 var T=TYPES[S.type];
 show(progress()+'<div class="card"><h2>Tell us about “'+esc(S.f.name)+'”</h2>'+
 '<label for="desc">Short description</label><textarea id="desc" placeholder="What is it, and what will people gain?">'+esc(S.f.desc)+'</textarea>'+
 '<label for="comm">Promoting to</label><select id="comm">'+['Whole church'].concat(COMMS).map(function(c){return '<option'+((S.f.comm||'Whole church')===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>'+
 '<label for="aud">Who is it for?</label><input id="aud" value="'+esc(S.f.aud)+'" placeholder="e.g. Married couples, young professionals">'+
 '<div class="row"><div><label for="date">'+T.dateLabel+'</label><input type="date" id="date" min="'+addDays(1).toISOString().slice(0,10)+'" value="'+esc(S.f.date)+'"></div>'+
 '<div><label for="email">Contact email <small>(optional)</small></label><input type="email" id="email" value="'+esc(S.f.email)+'"></div></div>'+
 '<div id="e" class="err"></div><div class="btns"><button id="back">Back</button><button class="p" id="next">Continue</button></div></div>');
 document.getElementById('back').onclick=function(){S.step=0;render()};
 document.getElementById('next').onclick=function(){
  var g=function(i){return document.getElementById(i).value.trim()};
  S.f.comm=g('comm');S.f.desc=g('desc');S.f.aud=g('aud');S.f.date=g('date');S.f.email=g('email');
  if(!S.f.desc)return err('Add a short description.');if(!S.f.date)return err('Pick a date so we can size the plan.');
  if(daysLeft()<1)return err('Choose a date that is tomorrow or later.');
  S.step=2;save();render()}}

function pickImg(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var sc=Math.min(1,1200/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.onerror=function(){cb(null)};im.src=r.result};r.onerror=function(){cb(null)};r.readAsDataURL(file)}
function questions(){
 var q=[];
 if(!S.f.aud)q.push(['aud','Who is the ideal person you want to reach?']);
 if(S.f.desc.length<80)q.push(['more',SHORT[0]]);
 EXTRA[S.type].forEach(function(x){q.push(x)});
 q.push(['action','What is the one thing you want people to do after seeing the page?']);
 return q}
function step2(){
 var qs=questions(),h='';
 qs.forEach(function(x){h+='<div class="q"><p>'+esc(x[1])+'</p><input data-k="'+x[0]+'" aria-label="'+esc(x[1])+'" value="'+esc(S.qa[x[0]])+'"></div>'});
 show(progress()+'<div class="card"><h2>A few more questions</h2><p class="note">Answer what you can. Skip anything that doesn’t apply.</p>'+h+
 '<h3 style="margin-top:1.4rem">Add an image <small style="font-weight:400;color:var(--muted)">(optional)</small></h3><label for="img" style="margin-top:.4rem">Poster, photo, or banner for the top of your page</label><input id="img" type="file" accept="image/*"><div id="prev"></div>'+
 '<h3 style="margin-top:1.4rem">Where should sign-ups go?</h3>'+
 '<label for="ep">Web app link <small>(optional: a Google Apps Script URL that saves sign-ups to a Sheet)</small></label><input id="ep" type="url" value="'+esc(S.endpoint)+'" placeholder="https://script.google.com/macros/s/…/exec">'+
 '<p class="note">With no link, the page opens an email to your contact address instead.</p>'+
 '<div class="btns"><button id="back">Back</button><button class="p" id="next">Create plan and page</button></div></div>');
 document.getElementById('back').onclick=function(){grab();S.step=1;render()};
 function showPrev(){document.getElementById('prev').innerHTML=S.img?'<img src="'+S.img+'" alt="Selected image preview" style="max-width:100%;max-height:240px;border-radius:10px;margin-top:.7rem"><div class="btns" style="margin-top:.6rem"><button type="button" id="rm">Remove image</button></div>':'';var r=document.getElementById('rm');if(r)r.onclick=function(){S.img='';document.getElementById('img').value='';save();showPrev()}}
 showPrev();
 document.getElementById('img').onchange=function(e){var f=e.target.files[0];if(!f)return;pickImg(f,function(d){if(!d){toast('That image could not be read');return}S.img=d;save();showPrev()})};
 document.getElementById('next').onclick=function(){grab();if(S.qa.aud)S.f.aud=S.qa.aud;S.step=3;S.tab='plan';save();render()};
 function grab(){app.querySelectorAll('[data-k]').forEach(function(i){S.qa[i.dataset.k]=i.value.trim()});S.endpoint=document.getElementById('ep').value.trim();save()}}

// ---------- PLAN ----------
function plan(){
 var D=daysLeft(),n=S.f.name,T=TYPES[S.type],date=nice(S.f.date),isEv=S.type==='event';
 var w=D>=21?[.15,.25,.35,.25]:D>=7?[.2,.45,.35]:[.4,.6];
 var names=D>=21?['Prepare','Announce','Build momentum','Final push']:D>=7?['Announce','Build momentum','Final push']:['Announce now','Final push'];
 var tasks={
 'Prepare':['Write one clear sentence: who it is for and what they gain','Publish the sign-up page and test it on your phone','Design one image or short video you can reuse everywhere','Ask 5 to 10 trusted people to be your first sharers'],
 'Announce':['Share the sign-up link on your main social page and in your messaging groups','Send a personal invite to the people who would benefit most','Make the announcement in your usual gatherings or newsletter','Post the main image with the sign-up link'],
 'Announce now':['Share the sign-up link today in every group and page you use','Personally message your top 15 people','Pin the post so it stays visible'],
 'Build momentum':['Share a story, testimony, or short teaching tied to the theme','Post a countdown or “what to expect” piece twice a week','Message people who opened the page but haven’t signed up','Thank and spotlight people who have signed up'],
 'Final push':['Send a “last chance” reminder with the date and the link','Follow up personally with everyone who showed interest','Post a final countdown every day in the last 3 days','Remind registered people of the details'+(isEv?' and how to arrive':'')]};
 tasks['Announce now'].push('Ask each person who signs up to invite one friend');
 var out=[],start=0,cum=0;
 names.forEach(function(nm,i){
  cum+=w[i];var end=i===names.length-1?D:Math.max(start+1,Math.round(D*cum));
  if(end>D)end=D;
  var key=nm;var s=addDays(start),e=addDays(Math.max(start,end-1));
  var days=end-start;
  out.push({name:nm,range:(days<=1?fmt(s):fmt(s)+' to '+fmt(e))+' ('+days+' day'+(days>1?'s':'')+')',tasks:tasks[key],sample:sample(nm)});
  start=end});
 var after=isEv?['Send a thank-you message with photos or highlights','Ask attendees for feedback and a testimony','Invite them to the next step or event']:['Thank everyone who signed up','Ask for feedback and a short testimony','Invite them to the next step'];
 out.push({name:isEv?'Event day and after':'Date reached and after',range:date,tasks:after,sample:null});
 return out}
function sample(p){
 var n=S.f.name,d=nice(S.f.date),a=S.f.aud||'you';if(S.f.comm&&S.f.comm!=='Whole church')a+=' in '+S.f.comm;else if(S.f.comm)a+=' (all of RLCC)';
 var l='[sign-up link]';
 var t={'Prepare':null,
 'Announce':'Something good is coming: '+n+', '+d+'.\nMade for '+a+'.\n'+short()+'\n'+TYPES[S.type].verb+' here: '+l,
 'Announce now':n+' is on '+d+'. Made for '+a+'.\n'+TYPES[S.type].verb+' here: '+l,
 'Build momentum':'Still thinking about '+n+'? Here is why it matters: '+short()+'\nJoin us on '+d+'. '+l,
 'Final push':'Last call for '+n+' on '+d+'. Spots and time are running out.\nDon’t miss it: '+l};
 return t[p]}
function short(){var s=S.f.desc.split(/(?<=[.!?])\s/)[0];return s.length>140?s.slice(0,137)+'…':s}

function planText(){
 var D=daysLeft(),t=S.f.name+' — marketing plan ('+D+' days to '+nice(S.f.date)+')\n\n';
 plan().forEach(function(p){t+=p.name+' | '+p.range+'\n';p.tasks.forEach(function(x){t+='- '+x+'\n'});if(p.sample)t+='\nSample post:\n'+p.sample+'\n';t+='\n'});return t}

// ---------- LANDING PAGE ----------
var BRAND=['#365233','#e0ae3a','#f3f6f1']; // RLCC green (fixed for all landing pages)
function metas(f){var d=esc(short()),t=esc(f.name),i=SITE+'og-image.jpg';
 return '<meta name="description" content="'+d+'"><meta property="og:type" content="website"><meta property="og:title" content="'+t+'"><meta property="og:description" content="'+d+'"><meta property="og:image" content="'+i+'"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="'+i+'">'}
function landing(){
 var f=S.f,qa=S.qa,T=TYPES[S.type],th=BRAND,det=[];
 if(f.date)det.push(['When',nice(f.date)+(qa.time?', '+qa.time:'')]);
 if(qa.schedule)det.push(['Schedule',qa.schedule]);
 if(qa.venue)det.push(['Where',qa.venue]);
 if(qa.format)det.push(['Format',qa.format]);
 if(qa.speaker)det.push(['With',qa.speaker]);
 if(qa.cost)det.push(['Cost',qa.cost]);
 if(qa.delivery)det.push(['You’ll receive it',qa.delivery]);
 if(qa.stock)det.push(['Availability',qa.stock]);
 if(f.comm)det.push(['Open to',f.comm==='Whole church'?'The whole church':f.comm]);
 if(f.aud)det.push(['Who it’s for',f.aud]);
 var dl=det.map(function(x){return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join('');
 var desc=esc(f.desc)+(qa.more?' '+esc(qa.more):'');
 var cta=esc(qa.action&&qa.action.length<28?qa.action:T.cta);
 return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(f.name)+'</title>'+metas(f)+
 '<style>:root{--p:'+th[0]+';--a:'+th[1]+';--b:'+th[2]+'}*{box-sizing:border-box}body{margin:0;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#17262b;background:var(--b)}'+
 '.hero{background:var(--p);color:#fff;padding:3.5rem 1.4rem 3rem}.w{max-width:680px;margin:0 auto}h1{font:700 clamp(2rem,7vw,3rem)/1.1 Georgia,serif;margin:0 0 1rem}.hero p{font-size:1.15rem;margin:0;opacity:.95}'+
 'dl{display:grid;gap:.9rem;margin:2rem 0}dl div{border-left:4px solid var(--a);padding-left:.9rem}dt{font-weight:700;color:var(--p)}dd{margin:0}'+
 'form{background:#fff;border-radius:14px;padding:1.4rem;box-shadow:0 2px 14px rgba(0,0,0,.08);margin:2rem 0}h2{font:700 1.5rem Georgia,serif;margin:0 0 .6rem;color:var(--p)}'+
 'label{display:block;font-weight:600;margin:.9rem 0 .3rem}input,select{width:100%;font:inherit;padding:.75rem;border:1px solid #bfcdd1;border-radius:10px}input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--a);outline-offset:2px}'+
 'button{width:100%;margin-top:1.2rem;font:inherit;font-weight:700;padding:.9rem;border:0;border-radius:10px;background:var(--a);color:#17262b;cursor:pointer}'+
 '.ph{display:block;width:100%;height:auto;border-radius:14px;margin:2rem 0 0;box-shadow:0 2px 14px rgba(0,0,0,.12)}.ok{display:none;background:#e7f4ea;border-radius:10px;padding:1rem;margin-top:1rem;font-weight:600}footer{text-align:center;color:#5d7077;font-size:.9rem;padding:0 1rem 2rem}</style></head><body>'+
 '<section class="hero"><div class="w"><img src="'+LOGO_W+'" alt="Real Life Christian Communities" style="height:42px;width:auto;display:block;margin-bottom:1.8rem"><h1>'+esc(f.name)+'</h1><p>'+desc+'</p></div></section>'+
 '<div class="w" style="padding:0 1.4rem">'+(S.img?'<img class="ph" src="'+S.img+'" alt="'+esc(f.name)+'">':'')+'<dl>'+dl+'</dl>'+
 '<form id="f"><h2>'+esc(T.verb==='Register'?'Reserve your spot':T.verb==='Get it'?'Get your copy':T.verb==='Sign up'?'Sign up':'Get updates')+'</h2>'+
 '<label for="n">Full name</label><input id="n" name="name" required autocomplete="name">'+
 '<label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email">'+
 '<label for="c">Your community</label><select id="c" name="community" required><option value="">Select your community</option>'+COMMS.concat(['No Community Yet']).map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select>'+
 '<input type="hidden" name="audience" value="'+esc(f.comm||'Whole church')+'"><input type="hidden" name="item" value="'+esc(f.name)+'"><button type="submit">'+cta+'</button>'+
 '<div class="ok" id="ok" role="status">Thank you! We received your details and will be in touch soon.</div></form></div>'+
 '<footer>© '+new Date().getFullYear()+' '+esc(f.name)+'</footer>'+
 '<script>var EP='+JSON.stringify(S.endpoint||DEFAULT_EP)+',MAIL='+JSON.stringify(f.email)+';'+
 'document.getElementById("f").addEventListener("submit",function(ev){ev.preventDefault();var fd=new FormData(ev.target),o={};fd.forEach(function(v,k){o[k]=v});'+
 'if(EP){fetch(EP,{method:"POST",mode:"no-cors",body:new URLSearchParams(o)}).then(done,done)}'+
 'else if(MAIL){location.href="mailto:"+MAIL+"?subject="+encodeURIComponent("Sign-up: "+o.item)+"&body="+encodeURIComponent("Name: "+o.name+"\\nEmail: "+o.email+"\\nCommunity: "+o.community);done()}'+
 'else done();function done(){ev.target.reset();document.getElementById("ok").style.display="block"}});<\/script></body></html>'}

function step3(){
 var h='<div class="tabs" role="tablist"><button role="tab" id="tp" aria-selected="'+(S.tab==='plan')+'">Marketing plan</button><button role="tab" id="tl" aria-selected="'+(S.tab==='land')+'">Landing page</button></div>';
 if(S.tab==='plan'){
  var D=daysLeft();h+='<div class="card"><h2>'+esc(S.f.name)+'</h2><p class="note">'+D+' day'+(D>1?'s':'')+' until '+esc(nice(S.f.date))+'. This plan fits that window.</p>';
  plan().forEach(function(p){h+='<div class="phase"><h3>'+esc(p.name)+'</h3><div class="when">'+esc(p.range)+'</div><ul>'+p.tasks.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>'+(p.sample?'<div class="sample">'+esc(p.sample)+'</div>':'')+'</div>'});
  h+='<div class="btns noprint"><button id="cp">Copy plan</button><button id="pr">Print or save as PDF</button></div></div>';
 }else{
  h+='<div class="card" id="land"><div style="margin:0 0 1rem"><iframe id="fr" title="Landing page preview"></iframe></div>'+
  '<div class="btns"><button class="p" id="dl">Download page (.html)</button><button id="ch">Copy HTML</button></div>'+
  '<p class="note">The file downloads as <b>index.html</b>. Put it at the top level of a new GitHub repo (not inside a folder), then turn on Pages: Settings, Pages, Deploy from a branch, main, / (root).</p></div>';
 }
 h+='<div class="btns"><button id="e1">Edit answers</button><button id="ne">Start a new one</button></div>';
 show(progress()+h);
 document.getElementById('tp').onclick=function(){S.tab='plan';step3()};document.getElementById('tl').onclick=function(){S.tab='land';step3()};
 document.getElementById('e1').onclick=function(){S.step=1;save();render()};
 document.getElementById('ne').onclick=function(){if(confirm('Clear everything and start over?')){S={step:0,type:'',f:{},qa:{},tab:'plan',theme:'teal',endpoint:'',email:'',img:''};save();render()}};
 if(S.tab==='plan'){document.getElementById('cp').onclick=function(){copy(planText())};document.getElementById('pr').onclick=function(){window.print()}}
 else{var fr=document.getElementById('fr');fr.srcdoc=landing();
    document.getElementById('ch').onclick=function(){copy(landing())};
  document.getElementById('dl').onclick=function(){var b=new Blob([landing()],{type:'text/html'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('Downloaded')}}
}
function copy(t){try{navigator.clipboard.writeText(t).then(function(){toast('Copied')},function(){toast('Copy failed')})}catch(e){toast('Copy failed')}}
function toast(m){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}

if(!S.endpoint&&DEFAULT_EP)S.endpoint=DEFAULT_EP;
if(S.step>0&&(!S.type||!S.f.name))S.step=0;
render();
})();
</script>
</body>
</html>
